<!doctype html><html lang="en"><head><script>
// Applies saved display choices (theme, contrast, text size) before first paint, so a reload never flashes the other setting first.
(function () {
  try {
    var d = document.documentElement, s = localStorage;
    var t = s.getItem('ledger_theme'), c = s.getItem('ledger_contrast'), x = s.getItem('ledger_text');
    if (t === 'dark' || t === 'light') d.setAttribute('data-theme', t);
    if (c === 'more' || c === 'standard') d.setAttribute('data-contrast', c);
    if (x === 'large' || x === 'larger') d.setAttribute('data-text', x);
  } catch (err) { /* storage unavailable; the system settings decide */ }
})();
</script>

[build]
  publish = "."
  command = ""


[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Internal: the email template is kept in the repo, not served.
[[redirects]]
  from = "/templates/*"
  to = "/404.html"
  status = 404
  force = true

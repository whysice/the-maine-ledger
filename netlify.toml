[build]
  publish = "."
  # Rebuilds the facility and bill pages from data/ledger.json; fails the deploy on a duplicate or unknown tag.
  command = "node scripts/build.mjs"


[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Internal: the email template is kept in the repo, not served.
[[redirects]]
  from = "/templates/*"
  to = "/404.html"
  status = 404
  force = true

[build]
  publish = "."
  # Rebuilds the generated pages from data/ledger.json and src/issues (fails on a bad tag), then builds the search index.
  command = "node scripts/build.mjs && npx -y pagefind@1.1.1 --site ."


[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Internal: the email template is kept in the repo, not served.
[[redirects]]
  from = "/templates/*"
  to = "/404.html"
  status = 404
  force = true

# Old addresses keep working.
[[redirects]]
  from = "/story"
  to = "/aroostook-jail"
  status = 301
  force = true

[[redirects]]
  from = "/story.html"
  to = "/aroostook-jail"
  status = 301
  force = true

[[redirects]]
  from = "/subscribe"
  to = "/#subscribe"
  status = 301

# Issue sources are built into /issue/N and the home page; not served directly.
[[redirects]]
  from = "/src/*"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/feed.xml"
  [headers.values]
    Content-Type = "application/rss+xml; charset=utf-8"

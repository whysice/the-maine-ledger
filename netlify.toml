[build]
  publish = "."
  command = ""

# Design preview: keep the site out of search results until launch.
# Remove this block when the entries are the published record.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
